<script>
const $=id=>document.getElementById(id), euro=new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}), PIN_KEY='renoweet_report_local_pin_hash_v1', LEGACY_PIN_KEY='renoweet_local_pin_hash_v1';
if(!localStorage.getItem(PIN_KEY)&&localStorage.getItem(LEGACY_PIN_KEY))localStorage.setItem(PIN_KEY,localStorage.getItem(LEGACY_PIN_KEY));
let D={sources:[],projects:[],invoices:[],expenses:[],fuel:[],auto:[],payments:[],orders:[],followups:[]}, charts=[];
const REPORT_HANDLE_DB='RenoweetReportHandlesDB', REPORT_HANDLE_STORE='handles', REPORT_HANDLE_KEY='sourceFiles';
function handleDB(){return new Promise((resolve,reject)=>{let q=indexedDB.open(REPORT_HANDLE_DB,1);q.onupgradeneeded=()=>q.result.createObjectStore(REPORT_HANDLE_STORE);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function saveSourceHandles(handles){try{let db=await handleDB();await new Promise((resolve,reject)=>{let tx=db.transaction(REPORT_HANDLE_STORE,'readwrite');tx.objectStore(REPORT_HANDLE_STORE).put(handles,REPORT_HANDLE_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(e){console.warn('Could not remember report file handles',e)}}
async function getSourceHandles(){try{let db=await handleDB();return await new Promise((resolve,reject)=>{let q=db.transaction(REPORT_HANDLE_STORE).objectStore(REPORT_HANDLE_STORE).get(REPORT_HANDLE_KEY);q.onsuccess=()=>resolve(q.result||[]);q.onerror=()=>reject(q.error)})}catch(e){return []}}
async function clearSourceHandles(){try{let db=await handleDB();await new Promise((resolve,reject)=>{let tx=db.transaction(REPORT_HANDLE_STORE,'readwrite');tx.objectStore(REPORT_HANDLE_STORE).delete(REPORT_HANDLE_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(e){}}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const n=v=>{let x=Number(String(v??0).replace(/[^0-9,.-]/g,'').replace(',','.'));return Number.isFinite(x)?x:0};
async function hashText(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function initLock(){let has=!!localStorage.getItem(PIN_KEY);$('setup').hidden=has;$('login').hidden=!has}initLock();
$('setupBtn').onclick=async()=>{let a=$('newPin').value,b=$('newPin2').value;if(!/^\d{6,}$/.test(a))return $('lockMsg').textContent='Use at least 6 digits.';if(a!==b)return $('lockMsg').textContent='PINs do not match.';localStorage.setItem(PIN_KEY,await hashText(a));unlock()};
$('loginBtn').onclick=async()=>{if(await hashText($('loginPin').value)!==localStorage.getItem(PIN_KEY))return $('lockMsg').textContent='Incorrect PIN.';unlock()};$('loginPin').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};function unlock(){$('lock').style.display='none';document.body.classList.remove('locked')}
